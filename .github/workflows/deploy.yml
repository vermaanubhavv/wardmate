# On every push to main: run the tests, then apply any new database patches (which also fails
# if any public table lacks row level security). Vercel's Git integration deploys the app
# itself, in parallel with this run, so a PR that needs a new patch can briefly run before
# the patch lands.
#
# Required GitHub repository secret (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL     Supabase Session pooler connection string (port 5432). Not the direct
#                       connection: that host is IPv6-only and GitHub's runners can't reach it.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

concurrency:
  group: deploy-main
  cancel-in-progress: false # never interrupt a deploy that is applying SQL

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Apply database patches
        run: npm run db:push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

