<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The ring: an open circle, like a stethoscope's tube, opening on the right where the
       tail runs down to the bell. Matches the reference mark: a "listening" shape rather
       than a generic medical cross. -->
  <path d="M 70.58 25.51 A 32 32 0 1 0 70.58 74.53"
        fill="none" stroke="#0F9E96" stroke-width="9" stroke-linecap="round" />
  <!-- The tail into the bell. -->
  <path d="M 70.58 74.53 Q 75 83 84 83"
        fill="none" stroke="#0F9E96" stroke-width="9" stroke-linecap="round" />
  <circle cx="87.5" cy="83" r="6.5" fill="#0F9E96" />
  <!-- Three dots inside the ring: the read-receipt / "still listening" mark. -->
  <circle cx="36" cy="50" r="3.4" fill="#0F9E96" />
  <circle cx="48" cy="50" r="3.4" fill="#0F9E96" />
  <circle cx="60" cy="50" r="3.4" fill="#0F9E96" />
</svg>
